components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: netmonorc_session
      description: Browser session; mutation вимагає CSRF заголовок.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque PAT
      description: CLI personal API token.
  schemas:
    ErrorDetail:
      type: object
      properties:
        path:
          type: string
        rule:
          type: string
        message:
          type: string
      required:
      - message
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - requestId
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
    ResourceManifest:
      type: object
      additionalProperties: false
      description: JSON-подання YAML DSL. Внутрішній spec проходить точну валідацію DSL-SPEC-001 за kind/apiVersion;
        `status` у request заборонено.
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
          const: netmonorc.io/v1alpha1
        kind:
          type: string
          enum: *id013
        metadata:
          type: object
          required:
          - name
          additionalProperties: false
          properties:
            name:
              type: string
              pattern: ^[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?$
            labels:
              type: object
              additionalProperties:
                type: string
            annotations:
              type: object
              additionalProperties:
                type: string
        spec:
          type: object
          description: Закрита kind-specific DSL схема визначена в NetMonOrc_DSL_Schema_v1alpha1.md; перевіряється
            server semantic validator.
    ResourceView:
      type: object
      required:
      - manifest
      - uid
      - generation
      - resourceVersion
      - createdAt
      - updatedAt
      properties:
        manifest:
          $ref: '#/components/schemas/ResourceManifest'
        status:
          type:
          - object
          - 'null'
        uid:
          type: string
          format: uuid
        generation:
          type: integer
        resourceVersion:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Page:
      type: object
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            type: object
        nextCursor:
          type:
          - string
          - 'null'
        totalApprox:
          type: integer
          minimum: 0
    ResourceRevision:
      type: object
      properties:
        uid:
          type: string
        generation:
          type: integer
        resourceVersion:
          type: string
        manifest:
          $ref: '#/components/schemas/ResourceManifest'
        changedAt:
          type: string
          format: date-time
        actor:
          type: string
    ResourceStatus:
      type: object
      properties:
        state:
          type: string
        desiredRevision:
          type: string
        assignedRevisions:
          type: object
        appliedRevisions:
          type: object
        conditions:
