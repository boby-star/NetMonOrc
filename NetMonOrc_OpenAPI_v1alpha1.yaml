openapi: 3.1.1
info:
  title: NetMonOrc HTTP API
  version: v1alpha1
  description: Повний контракт REST API і enrollment для NetMonOrc; точні поля kind-specific manifest — DSL-SPEC-001.
    Реалізовано read-only GET /api/v1/monitors/{name}/assessment через HTTPS bootstrap bearer reader. Інші маршрути та повні sessions/PAT/RBAC ще заплановані.
servers:
- url: https://master.example.com
  description: Змінити на реальну HTTPS адресу Master
tags:
- name: Auth
- name: Users
- name: Resources
- name: Configuration
- name: Agents
- name: Monitoring
- name: Diagnostics
- name: Alerts
- name: System
- name: Enrollment
security:
- cookieAuth: []
- bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Вхід до Web UI
      description: Створення серверної сесії із Secure/HttpOnly/SameSite cookie та CSRF-токеном.
      operationId: login
      x-netmonorc-rbac: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Вхід до Web UI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '400':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/StandardError'
        '403':
          $ref: '#/components/responses/StandardError'
        '404':
          $ref: '#/components/responses/StandardError'
        '409':
          $ref: '#/components/responses/StandardError'
        '412':
          $ref: '#/components/responses/StandardError'
        '422':
          $ref: '#/components/responses/StandardError'
        '428':
          $ref: '#/components/responses/StandardError'
        '429':
          $ref: '#/components/responses/StandardError'
        '503':
          $ref: '#/components/responses/StandardError'
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Вихід
      description: Відкликання поточної browser session; для CLI токена окремий delete.
      operationId: logout
      x-netmonorc-rbac: viewer
      responses:
        '204':
          description: Успішно, тіло відсутнє.
        '400':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/StandardError'
        '403':
          $ref: '#/components/responses/StandardError'
        '404':
          $ref: '#/components/responses/StandardError'
        '409':
          $ref: '#/components/responses/StandardError'
        '412':
          $ref: '#/components/responses/StandardError'
        '422':
          $ref: '#/components/responses/StandardError'
        '428':
          $ref: '#/components/responses/StandardError'
        '429':
          $ref: '#/components/responses/StandardError'
        '503':
          $ref: '#/components/responses/StandardError'
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: Моя ідентичність
      description: 'Поточний principal: userID, username, role, expiry; ніколи без секретів.'
      operationId: getCurrentUser
      x-netmonorc-rbac: viewer
      responses:
        '200':
          description: Моя ідентичність
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '400':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/StandardError'
        '403':
          $ref: '#/components/responses/StandardError'
        '404':
          $ref: '#/components/responses/StandardError'
        '409':
          $ref: '#/components/responses/StandardError'
        '412':
          $ref: '#/components/responses/StandardError'
        '422':
          $ref: '#/components/responses/StandardError'
        '428':
          $ref: '#/components/responses/StandardError'
        '429':
          $ref: '#/components/responses/StandardError'
        '503':
          $ref: '#/components/responses/StandardError'
  /api/v1/auth/change-password:
    post:
      tags:
      - Auth
      summary: Змінити власний пароль
      description: >-
        Вимагає чинну cookie-сесію, X-CSRF-Token та currentPassword.
        Новий пароль містить 16..256 байтів UTF-8 та зберігається як Argon2id hash.
        Успішна зміна атомарно відкликає всі попередні cookie-сесії користувача;
        відповідь встановлює нову Secure/HttpOnly/SameSite=Strict cookie та повертає
        SessionView з новим csrfToken. Неправильний поточний пароль дає 401,
        недопустимий новий пароль — 422. Обидві ролі можуть змінювати власний пароль.
      operationId: changeMyPassword
      x-netmonorc-rbac: viewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
      responses:
        '200':
          description: Змінити власний пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '400':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/StandardError'
        '403':
          $ref: '#/components/responses/StandardError'
        '404':
          $ref: '#/components/responses/StandardError'
        '409':
          $ref: '#/components/responses/StandardError'
        '412':
          $ref: '#/components/responses/StandardError'
        '422':
          $ref: '#/components/responses/StandardError'
        '428':
          $ref: '#/components/responses/StandardError'
        '429':
          $ref: '#/components/responses/StandardError'
        '503':
          $ref: '#/components/responses/StandardError'
  /api/v1/auth/tokens:
    get:
      tags:
      - Auth
      summary: Мої CLI-токени
      description: Metadata без secret; підтримує пагінацію.
      operationId: listApiTokens
      x-netmonorc-rbac: viewer
      parameters:
      - &id001
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - &id002
        name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Мої CLI-токени
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageApiTokens'
        '400':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/StandardError'
        '403':
          $ref: '#/components/responses/StandardError'
        '404':
          $ref: '#/components/responses/StandardError'
        '409':
          $ref: '#/components/responses/StandardError'
        '412':
          $ref: '#/components/responses/StandardError'
        '422':
          $ref: '#/components/responses/StandardError'
        '428':
          $ref: '#/components/responses/StandardError'
        '429':
          $ref: '#/components/responses/StandardError'
        '503':
          $ref: '#/components/responses/StandardError'
    post:
      tags:
      - Auth
      summary: Створити CLI-токен
      description: Повертає bearer secret лише один раз, scopes не можуть перевищувати права principal.
      operationId: issueApiToken
      x-netmonorc-rbac: viewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTokenCreate'
      responses:
        '201':
          description: Створити CLI-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenIssued'
        '400':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/StandardError'
        '403':
          $ref: '#/components/responses/StandardError'
        '404':
          $ref: '#/components/responses/StandardError'
        '409':
          $ref: '#/components/responses/StandardError'
        '412':
          $ref: '#/components/responses/StandardError'
        '422':
          $ref: '#/components/responses/StandardError'
        '428':
          $ref: '#/components/responses/StandardError'
        '429':
          $ref: '#/components/responses/StandardError'
        '503':
          $ref: '#/components/responses/StandardError'
  /api/v1/auth/tokens/{id}:
    delete:
      tags:
      - Auth
      summary: Відкликати CLI-токен
      description: ID з token metadata, без повторного розкриття secret.
      operationId: revokeApiToken
      x-netmonorc-rbac: viewer
      parameters:
      - &id003
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Успішно, тіло відсутнє.
        '400':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/StandardError'
        '403':
          $ref: '#/components/responses/StandardError'
        '404':
          $ref: '#/components/responses/StandardError'
        '409':
          $ref: '#/components/responses/StandardError'
        '412':
          $ref: '#/components/responses/StandardError'
        '422':
          $ref: '#/components/responses/StandardError'
        '428':
          $ref: '#/components/responses/StandardError'
        '429':
          $ref: '#/components/responses/StandardError'
        '503':
          $ref: '#/components/responses/StandardError'
  /api/v1/users:
    get:
      tags:
      - Users
      summary: Перелік користувачів
      description: Лише admin; без password hashes.
      operationId: listUsers
      x-netmonorc-rbac: admin
      parameters:
      - *id001
      - *id002
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Перелік користувачів
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageUsers'
        '400':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/StandardError'
        '403':
          $ref: '#/components/responses/StandardError'
        '404':
          $ref: '#/components/responses/StandardError'
        '409':
          $ref: '#/components/responses/StandardError'
        '412':
          $ref: '#/components/responses/StandardError'
        '422':
          $ref: '#/components/responses/StandardError'
        '428':
          $ref: '#/components/responses/StandardError'
        '429':
          $ref: '#/components/responses/StandardError'
        '503':
          $ref: '#/components/responses/StandardError'
    post:
      tags:
      - Users
      summary: Створити користувача
      description: Admin створює viewer/admin, пароль bootstrap через захищений механізм.
      operationId: createUser
      x-netmonorc-rbac: admin
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Створити користувача
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserView'
        '400':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/StandardError'
        '403':
          $ref: '#/components/responses/StandardError'
        '404':
          $ref: '#/components/responses/StandardError'
        '409':
          $ref: '#/components/responses/StandardError'
        '412':
          $ref: '#/components/responses/StandardError'
        '422':
          $ref: '#/components/responses/StandardError'
        '428':
          $ref: '#/components/responses/StandardError'
        '429':
          $ref: '#/components/responses/StandardError'
        '503':
          $ref: '#/components/responses/StandardError'
  /api/v1/users/{id}:
    get:
      tags:
      - Users
      summary: Дані користувача
      description: Без credentials.
      operationId: getUser
      x-netmonorc-rbac: admin
      parameters:
      - *id003
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Дані користувача
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserView'
        '400':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/StandardError'
        '403':
          $ref: '#/components/responses/StandardError'
        '404':
          $ref: '#/components/responses/StandardError'
        '409':
          $ref: '#/components/responses/StandardError'
        '412':
          $ref: '#/components/responses/StandardError'
        '422':
          $ref: '#/components/responses/StandardError'
        '428':
          $ref: '#/components/responses/StandardError'
        '429':
          $ref: '#/components/responses/StandardError'
        '503':
          $ref: '#/components/responses/StandardError'
    patch:
      tags:
      - Users
      summary: Змінити роль/disabled
      description: Admin не може заблокувати останнього активного admin.
      operationId: patchUser
      x-netmonorc-rbac: admin
      parameters:
      - *id003
      - &id006
        name: If-Match
        in: header
        required: true
        description: ETag/resourceVersion поточного ресурсу
        schema:
          type: string
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        '200':
          description: Змінити роль/disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserView'
        '400':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/StandardError'
        '403':
          $ref: '#/components/responses/StandardError'
        '404':
          $ref: '#/components/responses/StandardError'
        '409':
          $ref: '#/components/responses/StandardError'
        '412':
          $ref: '#/components/responses/StandardError'
        '422':
          $ref: '#/components/responses/StandardError'
        '428':
          $ref: '#/components/responses/StandardError'
        '429':
          $ref: '#/components/responses/StandardError'
        '503':
          $ref: '#/components/responses/StandardError'
  /api/v1/resources/{kind}:
    get:
      tags:
      - Resources
      summary: Список DSL-ресурсів
      description: Generic list для всіх 11 kind; labelSelector і курсорна пагінація.
      operationId: listResources
      x-netmonorc-rbac: viewer
      parameters:
      - &id004
        name: kind
        in: path
        required: true
        description: Точний kind із DSL-SPEC-001 (case-sensitive).
        schema:
          type: string
          enum: &id013
          - Target
          - Monitor
          - CheckProfile
          - PlacementPolicy
          - AssessmentPolicy
          - DiagnosticProfile
          - AlertRule
          - ResourceGroup
          - Dependency
          - Component
          - WebhookEndpoint
      - *id001
      - *id002
      - &id008
        name: labelSelector
        in: query
        description: Пари key=value через кому, логічне AND
        schema:
          type: string
      - &id007
        name: state
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Список DSL-ресурсів
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResources'
        '400':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/StandardError'
        '403':
          $ref: '#/components/responses/StandardError'
        '404':
          $ref: '#/components/responses/StandardError'
        '409':
          $ref: '#/components/responses/StandardError'
        '412':
          $ref: '#/components/responses/StandardError'
        '422':
          $ref: '#/components/responses/StandardError'
        '428':
          $ref: '#/components/responses/StandardError'
        '429':
          $ref: '#/components/responses/StandardError'
        '503':
          $ref: '#/components/responses/StandardError'
    post:
      tags:
      - Resources
      summary: Створити DSL-ресурс
      description: Create-only; body.kind має збігатися з URL; status заборонено. Повний semantic validate.
      operationId: createResource
      x-netmonorc-rbac: admin
      parameters:
      - *id004
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceManifest'
      responses:
        '201':
          description: Створити DSL-ресурс
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceView'
        '400':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/StandardError'
        '403':
          $ref: '#/components/responses/StandardError'
        '404':
          $ref: '#/components/responses/StandardError'
        '409':
          $ref: '#/components/responses/StandardError'
        '412':
          $ref: '#/components/responses/StandardError'
        '422':
          $ref: '#/components/responses/StandardError'
        '428':
          $ref: '#/components/responses/StandardError'
        '429':
          $ref: '#/components/responses/StandardError'
        '503':
          $ref: '#/components/responses/StandardError'
  /api/v1/resources/{kind}/{name}:
    get:
      tags:
      - Resources
      summary: Отримати DSL-ресурс
      description: Повертає manifest + status + revision; ETag для write.
      operationId: getResource
      x-netmonorc-rbac: viewer
      parameters:
      - *id004
      - &id005
        name: name
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?$
      responses:
        '200':
          description: Отримати DSL-ресурс
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceView'
        '400':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/StandardError'
        '403':
          $ref: '#/components/responses/StandardError'
        '404':
          $ref: '#/components/responses/StandardError'
        '409':
          $ref: '#/components/responses/StandardError'
        '412':
          $ref: '#/components/responses/StandardError'
        '422':
          $ref: '#/components/responses/StandardError'
        '428':
          $ref: '#/components/responses/StandardError'
        '429':
          $ref: '#/components/responses/StandardError'
        '503':
          $ref: '#/components/responses/StandardError'
    put:
      tags:
      - Resources
      summary: Повністю замінити ресурс
      description: Full spec/metadata replace; required If-Match, kind/name збігаються; без PATCH.
      operationId: replaceResource
      x-netmonorc-rbac: admin
      parameters:
      - *id004
      - *id005
      - *id006
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceManifest'
      responses:
        '200':
          description: Повністю замінити ресурс
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceView'
        '400':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/StandardError'
        '403':
          $ref: '#/components/responses/StandardError'
        '404':
          $ref: '#/components/responses/StandardError'
        '409':
          $ref: '#/components/responses/StandardError'
        '412':
          $ref: '#/components/responses/StandardError'
        '422':
          $ref: '#/components/responses/StandardError'
        '428':
          $ref: '#/components/responses/StandardError'
        '429':
          $ref: '#/components/responses/StandardError'
        '503':
          $ref: '#/components/responses/StandardError'
    delete:
      tags:
      - Resources
      summary: Видалити DSL-ресурс
      description: Required If-Match; за активних references повернути 409.
      operationId: deleteResource
      x-netmonorc-rbac: admin
      parameters:
      - *id004
      - *id005
      - *id006
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '204':
          description: Успішно, тіло відсутнє.
        '400':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/StandardError'
        '403':
          $ref: '#/components/responses/StandardError'
        '404':
          $ref: '#/components/responses/StandardError'
        '409':
          $ref: '#/components/responses/StandardError'
        '412':
          $ref: '#/components/responses/StandardError'
        '422':
          $ref: '#/components/responses/StandardError'
        '428':
          $ref: '#/components/responses/StandardError'
        '429':
          $ref: '#/components/responses/StandardError'
        '503':
          $ref: '#/components/responses/StandardError'
  /api/v1/resources/{kind}/{name}/revisions:
    get:
      tags:
      - Resources
      summary: Ревізії ресурсу
      description: Список desired versions та actor/time/diff, без секретів.
      operationId: listResourceRevisions
      x-netmonorc-rbac: viewer
      parameters:
      - *id004
      - *id005
      - *id001
      - *id002
      responses:
        '200':
          description: Ревізії ресурсу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageRevisions'
        '400':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/StandardError'
        '403':
          $ref: '#/components/responses/StandardError'
        '404':
          $ref: '#/components/responses/StandardError'
        '409':
          $ref: '#/components/responses/StandardError'
        '412':
          $ref: '#/components/responses/StandardError'
        '422':
          $ref: '#/components/responses/StandardError'
        '428':
          $ref: '#/components/responses/StandardError'
        '429':
          $ref: '#/components/responses/StandardError'
        '503':
          $ref: '#/components/responses/StandardError'
  /api/v1/resources/{kind}/{name}/status:
    get:
      tags:
      - Resources
      summary: Статус застосування ресурсу
      description: Read-only runtime status, desired/assigned/applied і conditions.
      operationId: getResourceStatus
      x-netmonorc-rbac: viewer
      parameters:
      - *id004
      - *id005
      responses:
        '200':
          description: Статус застосування ресурсу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceStatus'
        '400':
          $ref: '#/components/responses/StandardError'
        '401':
          $ref: '#/components/responses/StandardError'
        '403':
          $ref: '#/components/responses/StandardError'
        '404':
          $ref: '#/components/responses/StandardError'
        '409':
          $ref: '#/components/responses/StandardError'
        '412':
          $ref: '#/components/responses/StandardError'
        '422':
          $ref: '#/components/responses/StandardError'
        '428':
