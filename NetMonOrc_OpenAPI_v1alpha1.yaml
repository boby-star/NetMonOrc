        першої сторінки. Історичні ревізії не впливають на live assessment.
        Поточна реалізація вимагає browser cookie з resources:read; bootstrap bearer
        дозволяє лише Assessment. receivedAt походить із БД; isReplay та failureDomain
        не повертаються, якщо їх не збережено — значення не вгадуються.
