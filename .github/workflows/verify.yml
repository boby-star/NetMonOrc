name: Verify prototype
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: true
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./internal/agent ./internal/diagnostics ./internal/alerting ./internal/webhook
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
